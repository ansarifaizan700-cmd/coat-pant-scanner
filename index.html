<script>


/* =================================
   GOOGLE APPS SCRIPT URL
================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxF4O0CVmLIW9xsPkLw133SfQvz2yGjxETbTyaoANKSVvloPZtuPKbDTbiy-1zTO58PcQ/exec";


/* =================================
   VARIABLES
================================= */

let scanner = null;

let scanning = false;

let mode = "";

let checking = false;

let lastBarcode = "";

let lastScanTime = 0;

let newBarcodes = [];


/* =================================
   SELECT MODE
================================= */

function selectMode(selectedMode) {

  mode = selectedMode;

  document
    .getElementById("modeSelection")
    .style.display = "none";

  document
    .getElementById("scannerArea")
    .style.display = "block";


  document
    .getElementById("status")
    .innerText =

      selectedMode === "ENTRY"

        ? "🟢 ENTRY Mode — Camera start ho raha hai..."

        : "🔴 EXIT Mode — Camera start ho raha hai...";


  startScanner();

}


/* =================================
   START SCANNER
================================= */

function startScanner() {

  if (scanning) return;


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 280,
      height: 140
    }

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    scanning = true;

    document
      .getElementById("status")
      .innerText =

        mode === "ENTRY"

          ? "🟢 ENTRY — Barcode scan karein"

          : "🔴 EXIT — Barcode scan karein";

  })

  .catch(function(error) {

    console.error(error);

    document
      .getElementById("status")
      .innerText =
        "❌ Camera start nahi ho paya. Permission check karein.";

  });

}


/* =================================
   SCAN SUCCESS
================================= */

function onScanSuccess(decodedText) {

  const barcode =
    String(decodedText).trim();


  if (!barcode) return;


  const now =
    Date.now();


  /*
   * Same barcode ko camera ke
   * continuous scanning se rokna
   */

  if (

    barcode === lastBarcode &&

    now - lastScanTime < 2500

  ) {

    return;

  }


  lastBarcode =
    barcode;

  lastScanTime =
    now;


  if (checking) return;


  /*
   * ENTRY:
   * Current batch mein duplicate
   */

  if (

    mode === "ENTRY" &&

    newBarcodes.includes(barcode)

  ) {

    showResult(

      "warning",

      "⚠️ Duplicate Barcode",

      `<p>
        Barcode
        <strong>
          ${escapeHtml(barcode)}
        </strong>
        already scan ho chuka hai.
      </p>

      <p>
        Ye barcode dobara add nahi hoga.
      </p>`

    );


    document
      .getElementById("status")
      .innerText =
        "⚠️ Duplicate barcode — add nahi hua";


    return;

  }


  checking = true;


  document
    .getElementById("status")
    .innerText =
      "🔍 Barcode checking...";


  checkBarcode(barcode);

}


/* =================================
   CHECK BARCODE
================================= */

async function checkBarcode(barcode) {

  try {


    const url =

      API_URL +

      "?action=check" +

      "&mode=" +
      encodeURIComponent(mode) +

      "&barcode=" +
      encodeURIComponent(barcode);


    const response =
      await fetch(url);


    const data =
      await response.json();


    console.log(data);


    /* =================================
       ENTRY - NEW
    ================================= */

    if (

      mode === "ENTRY" &&

      data.status === "NEW_BARCODE"

    ) {


      if (

        !newBarcodes.includes(
          data.barcode
        )

      ) {

        newBarcodes.push(
          data.barcode
        );

      }


      updateBarcodeList();


      document
        .getElementById("productForm")
        .style.display =
          "block";


      showResult(

        "new",

        "🆕 New Barcode",

        `<p>
          Barcode list mein add ho gaya.
        </p>

        <p>
          Ab aur barcode scan kar sakte hain.
        </p>`

      );


      document
        .getElementById("status")
        .innerText =
          "🟢 Aur barcode scan karein ya SAVE ENTRY karein";


      return;

    }


    /* =================================
       ENTRY - ALREADY REGISTERED
    ================================= */

    if (

      mode === "ENTRY" &&

      data.status === "ALREADY_REGISTERED"

    ) {


      showResult(

        "warning",

        "⚠️ Already Registered",

        `<div class="row">

          <span class="label">
            Barcode:
          </span>

          ${escapeHtml(data.barcode)}

        </div>

        <p>
          Ye barcode Products sheet mein
          already registered hai.
        </p>

        <p>
          Dobara ENTRY nahi hogi.
        </p>`

      );


      return;

    }


    /* =================================
       EXIT - PRODUCT FOUND
    ================================= */

    if (

      mode === "EXIT" &&

      data.status === "EXIT_SUCCESS"

    ) {


      /*
       * Ab actual EXIT process
       */

      await processExit(
        barcode
      );


      return;

    }


    /* =================================
       EXIT - NOT FOUND
    ================================= */

    if (

      mode === "EXIT" &&

      data.status === "NOT_FOUND"

    ) {


      showResult(

        "error",

        "❌ Product Not Found",

        `<p>
          ${escapeHtml(
            data.message
          )}
        </p>`

      );


      document
        .getElementById("status")
        .innerText =
          "❌ Product Products sheet mein nahi mila";


      return;

    }


    /* =================================
       GENERAL ERROR
    ================================= */

    showResult(

      "error",

      "❌ Error",

      `<p>
        ${escapeHtml(
          data.message ||
          "Something went wrong"
        )}
      </p>`

    );


  }

  catch (error) {

    console.error(error);


    showResult(

      "error",

      "⚠️ Connection Error",

      `<p>
        Google Sheet se connection nahi ho paya.
      </p>

      <p>
        Internet connection check karein.
      </p>`

    );

  }

  finally {

    checking = false;

  }

}


/* =================================
   ACTUAL EXIT PROCESS
================================= */

async function processExit(barcode) {

  try {


    document
      .getElementById("status")
      .innerText =
        "⏳ Product EXIT ho raha hai...";


    const url =

      API_URL +

      "?action=processExit" +

      "&barcode=" +

      encodeURIComponent(barcode);


    const response =
      await fetch(url);


    const data =
      await response.json();


    console.log(data);


    if (
      data.success &&
      data.status === "EXIT_SUCCESS"
    ) {


      /*
       * Camera stop
       */

      await stopScanner();


      /*
       * Thank You screen
       */

      document
        .getElementById("result")
        .style.display =
          "none";


      document
        .getElementById("thankYou")
        .style.display =
          "block";


      document
        .getElementById("thankText")
        .innerHTML =

          "🔴 Product successfully OUT ho gaya.<br><br>" +

          "<strong>Barcode:</strong> " +

          escapeHtml(
            data.barcode
          ) +

          "<br><br>" +

          "<strong>Design:</strong> " +

          escapeHtml(
            data.designName
          );

    }

    else {


      showResult(

        "warning",

        "⚠️ EXIT nahi hua",

        `<p>
          ${escapeHtml(
            data.message ||
            "Product exit nahi ho paya."
          )}
        </p>`

      );

    }


  }

  catch (error) {

    console.error(error);


    showResult(

      "error",

      "⚠️ Connection Error",

      `<p>
        Product EXIT nahi ho paya.
      </p>

      <p>
        Google Sheet connection check karein.
      </p>`

    );

  }

  finally {

    checking = false;

  }

}


/* =================================
   UPDATE BARCODE LIST
================================= */

function updateBarcodeList() {


  document
    .getElementById("barcodeCount")
    .innerText =
      newBarcodes.length;


  const list =
    document.getElementById(
      "barcodeList"
    );


  list.innerHTML = "";


  newBarcodes.forEach(
    function(barcode, index) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "barcode-item";


      const text =
        document.createElement(
          "span"
        );


      text.className =
        "barcode-number";


      text.innerText =

        (index + 1) +
        ". " +
        barcode;


      const removeBtn =
        document.createElement(
          "button"
        );


      removeBtn.type =
        "button";


      removeBtn.className =
        "remove-barcode-btn";


      removeBtn.innerText =
        "➖";


      removeBtn.title =
        "Remove Barcode";


      removeBtn.onclick =
        function() {

          removeBarcode(index);

        };


      div.appendChild(text);

      div.appendChild(removeBtn);

      list.appendChild(div);

    }
  );

}


/* =================================
   REMOVE BARCODE
================================= */

function removeBarcode(index) {


  if (

    index < 0 ||

    index >= newBarcodes.length

  ) {

    return;

  }


  const removedBarcode =
    newBarcodes[index];


  newBarcodes.splice(
    index,
    1
  );


  updateBarcodeList();


  if (
    newBarcodes.length === 0
  ) {

    document
      .getElementById("productForm")
      .style.display =
        "none";

  }


  showResult(

    "warning",

    "➖ Barcode Removed",

    `<p>
      Barcode
      <strong>
        ${escapeHtml(
          removedBarcode
        )}
      </strong>
      list se remove kar diya gaya.
    </p>

    <p>
      Ise chahein to dobara scan kar sakte hain.
    </p>`

  );


  document
    .getElementById("status")
    .innerText =
      "🟢 Barcode remove ho gaya.";

}


/* =================================
   SAVE ENTRY
================================= */

async function saveEntry() {


  if (
    newBarcodes.length === 0
  ) {

    alert(
      "Pehle barcode scan karein."
    );

    return;

  }


  const designCode =
    document
      .getElementById(
        "designCode"
      )
      .value.trim();


  const designName =
    document
      .getElementById(
        "designName"
      )
      .value.trim();


  const size =
    document
      .getElementById(
        "size"
      )
      .value.trim();


  const color =
    document
      .getElementById(
        "color"
      )
      .value.trim();


  const type =
    document
      .getElementById(
        "type"
      )
      .value.trim();


  const mrp =
    document
      .getElementById(
        "mrp"
      )
      .value.trim();


  if (!designCode) {

    alert(
      "Design Code bharna zaroori hai."
    );

    return;

  }


  if (!designName) {

    alert(
      "Design Name bharna zaroori hai."
    );

    return;

  }


  if (!size) {

    alert(
      "Size bharna zaroori hai."
    );

    return;

  }


  if (!color) {

    alert(
      "Color bharna zaroori hai."
    );

    return;

  }


  if (!type) {

    alert(
      "Type bharna zaroori hai."
    );

    return;

  }


  if (!mrp) {

    alert(
      "MRP bharna zaroori hai."
    );

    return;

  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;


  saveBtn.innerText =
    "⏳ Saving...";


  try {


    const params =
      new URLSearchParams();


    params.append(
      "action",
      "saveEntry"
    );


    params.append(
      "barcodes",
      newBarcodes.join("\n")
    );


    params.append(
      "designCode",
      designCode
    );


    params.append(
      "designName",
      designName
    );


    params.append(
      "size",
      size
    );


    params.append(
      "color",
      color
    );


    params.append(
      "type",
      type
    );


    params.append(
      "mrp",
      mrp
    );


    const response =
      await fetch(

        API_URL +
        "?" +
        params.toString()

      );


    const data =
      await response.json();


    console.log(data);


    if (

      data.success &&

      data.status ===
      "ENTRY_SUCCESS"

    ) {


      await stopScanner();


      document
        .getElementById(
          "productForm"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "result"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "thankYou"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "thankText"
        )
        .innerHTML =

          "🟢 Entry successfully completed.<br><br>" +

          "<strong>" +

          data.count +

          "</strong> products Products sheet mein add ho gaye.<br><br>" +

          "Scan Log mein ENTRY nahi hui.";

    }

    else {


      alert(

        data.message ||

        "Entry save nahi hui."

      );

    }


  }

  catch (error) {

    console.error(error);


    alert(
      "Google Sheet se connection nahi ho paya."
    );

  }


  saveBtn.disabled =
    false;


  saveBtn.innerText =
    "💾 SAVE ENTRY";

}


/* =================================
   NEW SCAN
================================= */

function newScan() {


  newBarcodes = [];

  mode = "";

  lastBarcode = "";

  lastScanTime = 0;

  checking = false;


  document
    .getElementById(
      "thankYou"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "scannerArea"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "productForm"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "result"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "modeSelection"
    )
    .style.display =
      "block";


  clearForm();

  updateBarcodeList();

}


/* =================================
   CLEAR FORM
================================= */

function clearForm() {


  document
    .getElementById(
      "designCode"
    )
    .value = "";


  document
    .getElementById(
      "designName"
    )
    .value = "";


  document
    .getElementById(
      "size"
    )
    .value = "";


  document
    .getElementById(
      "color"
    )
    .value = "";


  document
    .getElementById(
      "type"
    )
    .value = "";


  document
    .getElementById(
      "mrp"
    )
    .value = "";

}


/* =================================
   SHOW RESULT
================================= */

function showResult(
  type,
  title,
  content
) {


  const box =
    document.getElementById(
      "result"
    );


  box.style.display =
    "block";


  box.className =
    "result " +
    type;


  box.innerHTML =

    "<h3>" +
    title +
    "</h3>" +

    content;

}


/* =================================
   STOP SCANNER
================================= */

async function stopScanner() {


  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {

    await scanner.stop();

/* =================================
   ESCAPE HTML
================================= */

function escapeHtml(value) {


  if (

    value === null ||

    value === undefined

  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
