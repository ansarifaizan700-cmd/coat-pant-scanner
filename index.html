<div class="container">

  <p>

    Details sirf <strong>ek baar</strong> bharein.
  </p>


  <div class="barcode-count">

    📦
    <span id="barcodeCount">0</span>
    Barcodes

    class="barcode-list">

<script>


/* =====================================================
   API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxF4O0CVmLIW9xsPkLw133SfQvz2yGjxETbTyaoANKSVvloPZtuPKbDTbiy-1zTO58PcQ/exec";


/* =====================================================
   VARIABLES
   ===================================================== */

let scanner = null;

let scanning = false;

let mode = "";

let checking = false;

let lastBarcode = "";

let lastScanTime = 0;

let newBarcodes = [];


/* =====================================================
   SELECT MODE
   ===================================================== */

function selectMode(selectedMode) {

  mode =
    selectedMode;


  document
    .getElementById(
      "modeSelection"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "scannerArea"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "status"
    )
    .innerText =

    selectedMode === "ENTRY"

      ? "🟢 ENTRY Mode — Camera start ho raha hai..."

      : "🔴 EXIT Mode — Camera start ho raha hai...";


  startScanner();

}


/* =====================================================
   START CAMERA
   ===================================================== */

function startScanner() {

  if (scanning) return;


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 280,
      height: 140
    }

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(() => {

    scanning = true;


    document
      .getElementById(
        "status"
      )
      .innerText =

      mode === "ENTRY"

        ? "🟢 ENTRY — Barcode scan karein"

        : "🔴 EXIT — Barcode scan karein";

  })

  .catch(error => {

    console.error(error);

    document
      .getElementById(
        "status"
      )
      .innerText =
      "❌ Camera start nahi ho paya.";

  });

}


/* =====================================================
   SCAN SUCCESS
   ===================================================== */

function onScanSuccess(decodedText) {

  const barcode =
    String(decodedText).trim();


  if (!barcode) return;


  const now =
    Date.now();


  if (

    barcode === lastBarcode &&

    now - lastScanTime < 3000

  ) {

    return;

  }


  lastBarcode =
    barcode;


  lastScanTime =
    now;


  if (checking) return;


  /*
   * ENTRY batch mein same barcode
   */

  if (

    mode === "ENTRY" &&

    newBarcodes.includes(barcode)

  ) {

    showResult(

      "warning",

      "⚠️ Duplicate Barcode",

      `<p>
        ${escapeHtml(barcode)}
        already current batch mein hai.
      </p>`

    );

    return;

  }


  checking = true;


  document
    .getElementById(
      "status"
    )
    .innerText =
    "🔍 Barcode checking...";


  checkBarcode(barcode);

}


/* =====================================================
   BARCODE CHECK
   ===================================================== */

async function checkBarcode(barcode) {

  try {


    const url =

      API_URL +

      "?action=check" +

      "&mode=" +
      encodeURIComponent(mode) +

      "&barcode=" +
      encodeURIComponent(barcode);


    const response =
      await fetch(url);


    const data =
      await response.json();


    console.log(data);


    /* =================================================
       ENTRY - NEW
       ================================================= */

    if (

      mode === "ENTRY" &&

      data.status === "NEW_BARCODE"

    ) {


      newBarcodes.push(
        data.barcode
      );


      updateBarcodeList();


      document
        .getElementById(
          "productForm"
        )
        .style.display =
        "block";


      showResult(

        "new",

        "🆕 New Barcode",

        `<p>
          Barcode successfully batch mein add ho gaya.
        </p>`

      );


      document
        .getElementById(
          "status"
        )
        .innerText =
        "🟢 Aur barcode scan karein ya form submit karein";


      return;

    }


    /* =================================================
       ENTRY - ALREADY REGISTERED
       ================================================= */

    if (

      mode === "ENTRY" &&

      data.status === "ALREADY_REGISTERED"

    ) {


      showResult(

        "warning",

        "⚠️ Already Registered",

        `

        <div class="row">
          <span class="label">Barcode:</span>
          ${escapeHtml(data.barcode)}
        </div>

        <p>
          Ye barcode Product List mein
          already registered hai.
          Dobara ENTRY nahi hogi.
        </p>

        `

      );


      return;

    }


    /* =================================================
       EXIT SUCCESS
       ================================================= */

    if (

      mode === "EXIT" &&

      data.status === "EXIT_SUCCESS"

    ) {


      showResult(

        "success",

        "✅ EXIT Successful",

        `

        <div class="row">
          <span class="label">Barcode:</span>
          ${escapeHtml(data.barcode)}
        </div>

        <div class="row">
          <span class="label">Design:</span>
          ${escapeHtml(data.designName)}
        </div>

        <div class="row">
          <span class="label">Size:</span>
          ${escapeHtml(data.size)}
        </div>

        <div class="row">
          <span class="label">Color:</span>
          ${escapeHtml(data.color)}
        </div>

        <p>
          📦 Product successfully OUT ho gaya.
        </p>

        `

      );


      return;

    }


    /* =================================================
       EXIT - NOT FOUND
       ================================================= */

    if (

      mode === "EXIT" &&

      data.status === "NOT_FOUND"

    ) {


      showResult(

        "error",

        "❌ Product Not Found",

        `<p>
          ${escapeHtml(data.message)}
        </p>`

      );


      return;

    }


    /* =================================================
       EXIT - ALREADY OUT
       ================================================= */

    if (

      mode === "EXIT" &&

      data.status === "ALREADY_OUT"

    ) {


      showResult(

        "warning",

        "⚠️ Already OUT",

        `<p>
          ${escapeHtml(data.message)}
        </p>`

      );


      return;

    }


    /* =================================================
       OTHER ERROR
       ================================================= */

    showResult(

      "error",

      "❌ Error",

      `<p>
        ${escapeHtml(
          data.message ||
          "Something went wrong"
        )}
      </p>`

    );


  }

  catch (error) {


    console.error(error);


    showResult(

      "error",

      "⚠️ Connection Error",

      `<p>
        Google Sheet se connection nahi ho paya.
      </p>`

    );

  }


  finally {

    checking = false;

  }

}


/* =====================================================
   UPDATE BARCODE LIST
   ===================================================== */

function updateBarcodeList() {

  document
    .getElementById(
      "barcodeCount"
    )
    .innerText =
    newBarcodes.length;


  const list =
    document.getElementById(
      "barcodeList"
    );


  list.innerHTML = "";


  newBarcodes.forEach(
    function(barcode, index) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "barcode-item";


      div.innerText =

        (index + 1) +

        ". " +

        barcode;


      list.appendChild(div);

    }
  );

}


/* =====================================================
   SAVE ENTRY
   ===================================================== */

async function saveEntry() {


  if (
    newBarcodes.length === 0
  ) {

    alert(
      "Pehle barcode scan karein."
    );

    return;

  }


  const designCode =
    document
      .getElementById(
        "designCode"
      )
      .value.trim();


  const designName =
    document
      .getElementById(
        "designName"
      )
      .value.trim();


  const size =
    document
      .getElementById(
        "size"
      )
      .value.trim();


  const color =
    document
      .getElementById(
        "color"
      )
      .value.trim();


  const type =
    document
      .getElementById(
        "type"
      )
      .value.trim();


  const mrp =
    document
      .getElementById(
        "mrp"
      )
      .value.trim();


  if (!designCode) {

    alert("Design Code bharna zaroori hai.");

    return;

  }


  if (!designName) {

    alert("Design Name bharna zaroori hai.");

    return;

  }


  if (!size) {

    alert("Size bharna zaroori hai.");

    return;

  }


  if (!color) {

    alert("Color bharna zaroori hai.");

    return;

  }


  if (!type) {

    alert("Type bharna zaroori hai.");

    return;

  }


  if (!mrp) {

    alert("MRP bharna zaroori hai.");

    return;

  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;


  saveBtn.innerText =
    "⏳ Saving...";


  try {


    const params =
      new URLSearchParams();


    params.append(
      "action",
      "saveEntry"
    );


    params.append(
      "barcodes",
      newBarcodes.join("\n")
    );


    params.append(
      "designCode",
      designCode
    );


    params.append(
      "designName",
      designName
    );


    params.append(
      "size",
      size
    );


    params.append(
      "color",
      color
    );


    params.append(
      "type",
      type
    );


    params.append(
      "mrp",
      mrp
    );


    const response =
      await fetch(

        API_URL +
        "?" +
        params.toString()

      );


    const data =
      await response.json();


    if (
      data.success
    ) {


      /*
       * Camera stop
       */

      await stopScanner();


      /*
       * Form hide
       */

      document
        .getElementById(
          "productForm"
        )
        .style.display =
        "none";


      /*
       * Thank you screen
       */

      document
        .getElementById(
          "thankYou"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "thankText"
        )
        .innerHTML =

        "✅ " +

        data.count +

        " products successfully ENTRY ho gaye.<br><br>" +

        "Aapka inventory record save ho gaya hai.";

    }

    else {


      alert(
        data.message ||
        "Entry save nahi hui."
      );

    }


  }

  catch (error) {


    console.error(error);


    alert(
      "Google Sheet se connection nahi ho paya."
    );

  }


  saveBtn.disabled =
    false;


  saveBtn.innerText =
    "💾 SAVE ENTRY";

}


/* =====================================================
   NEW SCAN
   ===================================================== */

function newScan() {


  /*
   * Reset everything
   */

  newBarcodes =
    [];


  mode =
    "";


  lastBarcode =
    "";


  lastScanTime =
    0;


  checking =
    false;


  document
    .getElementById(
      "thankYou"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "scannerArea"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "productForm"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "result"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "modeSelection"
    )
    .style.display =
    "block";


  clearForm();


  updateBarcodeList();

}


/* =====================================================
   CLEAR FORM
   ===================================================== */

function clearForm() {


  document
    .getElementById(
      "designCode"
    )
    .value = "";


  document
    .getElementById(
      "designName"
    )
    .value = "";


  document
    .getElementById(
      "size"
    )
    .value = "";


  document
    .getElementById(
      "color"
    )
    .value = "";


  document
    .getElementById(
      "type"
    )
    .value = "";


  document
    .getElementById(
      "mrp"
    )
    .value = "";

}


/* =====================================================
   SHOW RESULT
   ===================================================== */

function showResult(
  type,
  title,
  content
) {


  const box =
    document.getElementById(
      "result"
    );


  box.style.display =
    "block";


  box.className =
    "result " +
    type;


  box.innerHTML =

    "<h3>" +

    title +

    "</h3>" +

    content;

}


/* =====================================================
   STOP SCANNER
   ===================================================== */

async function stopScanner() {


  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {


    await scanner.stop();


    scanner.clear();


    scanning =
      false;


  }

  catch (error) {

    console.error(error);

  }

}


/* =====================================================
   SCAN FAILURE
   ===================================================== */

function onScanFailure(error) {

  // Normal scan failures ignore

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {


  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
